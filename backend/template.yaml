AWSTemplateFormatVersion: '2010-09-09'
Description: Orbit v1.1 backend, Console-only deployment using an EXISTING Cognito user pool and app client.
Parameters:
  ExistingUserPoolId:
    Type: String
    Default: ap-south-2_9iJLvmnID
    Description: Existing Orbit Cognito User Pool ID
  ExistingAppClientId:
    Type: String
    Default: 1rd7ja42mel9fhejr8dv610vcq
    Description: Existing Orbit Cognito SPA App Client ID
  AllowedFrontendOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Browser origin, no trailing slash. For first testing localhost; later use https://USERNAME.github.io
Resources:
  OrbitTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: pk
        AttributeType: S
      - AttributeName: sk
        AttributeType: S
      KeySchema:
      - AttributeName: pk
        KeyType: HASH
      - AttributeName: sk
        KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      Tags:
      - Key: Project
        Value: Orbit
  OrbitLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action:
          - sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
      - PolicyName: OrbitDynamoAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchGetItem
            - dynamodb:TransactWriteItems
            Resource:
              Fn::GetAtt:
              - OrbitTable
              - Arn
  OrbitFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs22.x
      Handler: index.handler
      Role:
        Fn::GetAtt:
        - OrbitLambdaRole
        - Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          ORBIT_TABLE:
            Ref: OrbitTable
      Code:
        ZipFile: "const {randomUUID} = require('node:crypto');\nconst {DynamoDBClient} = require('@aws-sdk/client-dynamodb');\n\
          const {DynamoDBDocumentClient,GetCommand,PutCommand,QueryCommand,DeleteCommand,BatchGetCommand,TransactWriteCommand}\
          \ = require('@aws-sdk/lib-dynamodb');\n\nconst db=DynamoDBDocumentClient.from(new DynamoDBClient({}),{marshallOptions:{removeUndefinedValues:true}});\n\
          const TableName=process.env.ORBIT_TABLE;\nconst defaultCategories=[\n {id:'academics',name:'Academics',icon:'GraduationCap',color:'#7968EE'},\n\
          \ {id:'routine',name:'Daily routine',icon:'Sun',color:'#FFA74D'},\n {id:'projects',name:'Projects',icon:'Layers3',color:'#4698F0'},\n\
          \ {id:'research',name:'Research',icon:'FlaskConical',color:'#28BAAA'},\n {id:'hobbies',name:'Hobbies',icon:'Palette',color:'#B179DF'},\n\
          \ {id:'fun',name:'Fun & leisure',icon:'Clapperboard',color:'#F375A7'},\n {id:'misc',name:'Miscellaneous',icon:'Sparkles',color:'#8596B8'}\n\
          ];\nconst key=(pk,sk)=>({pk,sk});\nconst userPK=uid=>`USER#${uid}`;\nconst fail=(code,msg)=>{const e=new\
          \ Error(msg);e.statusCode=code;throw e;};\nconst good=(data,code=200)=>({statusCode:code,headers:{'Content-Type':'application/json','Cache-Control':'no-store'},body:JSON.stringify(data)});\n\
          const errInfo=e=>{if(e?.name==='ConditionalCheckFailedException'||e?.name==='TransactionCanceledException')return\
          \ {statusCode:409,message:'This item changed or is already present. Refresh and try again.'};return {statusCode:e?.statusCode||500,message:e?.statusCode?e.message:'A\
          \ server error occurred. Please try again.'};};\nconst text=(value,max=200)=>typeof value==='string'?value.trim().slice(0,max):'';\n\
          const validId=s=>typeof s==='string'&&/^[a-zA-Z0-9_-]{1,80}$/.test(s);\nconst validDate=s=>{if(typeof\
          \ s!=='string'||!/^\\d{4}-\\d{2}-\\d{2}$/.test(s))return false;const dt=new Date(`${s}T12:00:00Z`);return\
          \ Number.isFinite(dt.getTime())&&dt.toISOString().slice(0,10)===s;};\nconst isoDate=s=>new Date(`${s}T12:00:00Z`);\n\
          const isOccurrence=(t,day)=>{\n if(!validDate(day)||day<t.date||(t.endDate&&day>t.endDate))return false;\n\
          \ if(t.repeat==='none')return day===t.date;\n if(t.repeat==='daily')return true;\n if(t.repeat==='weekly')return\
          \ (t.weekdays?.length?t.weekdays:[isoDate(t.date).getUTCDay()]).includes(isoDate(day).getUTCDay());\n\
          \ if(t.repeat==='monthly')return day.slice(8)===t.date.slice(8);\n if(t.repeat==='yearly')return day.slice(5)===t.date.slice(5);\n\
          \ return false;\n};\nconst get=async(pk,sk)=> (await db.send(new GetCommand({TableName,Key:key(pk,sk),ConsistentRead:true}))).Item;\n\
          const put=async Item=>db.send(new PutCommand({TableName,Item}));\nconst del=async(pk,sk)=>db.send(new\
          \ DeleteCommand({TableName,Key:key(pk,sk)}));\nasync function query(pk,prefix){\n let last,all=[],pages=0;\n\
          \ do{const r=await db.send(new QueryCommand({TableName,KeyConditionExpression:prefix?'pk = :pk AND begins_with(sk,\
          \ :sk)':'pk = :pk',ExpressionAttributeValues:prefix?{':pk':pk,':sk':prefix}:{':pk':pk},ExclusiveStartKey:last}));all.push(...(r.Items||[]));last=r.LastEvaluatedKey;pages++;if(all.length>1500)fail(413,'Workspace\
          \ is too large for this starter.');}while(last&&pages<20);\n if(last)fail(413,'Workspace exceeds the starter\
          \ limit.');\n return all;\n}\nasync function batchGetTasks(ids){\n const uniq=[...new Set(ids)].filter(validId),out=[];\n\
          \ for(let i=0;i<uniq.length;i+=100){let keys=uniq.slice(i,i+100).map(id=>key(`TASK#${id}`,'META'));\n\
          \  for(let attempts=0;keys.length&&attempts<5;attempts++){\n   const res=await db.send(new BatchGetCommand({RequestItems:{[TableName]:{Keys:keys}}}));out.push(...(res.Responses?.[TableName]||[]));keys=res.UnprocessedKeys?.[TableName]?.Keys||[];\n\
          \   if(keys.length)await new Promise(r=>setTimeout(r,30*(attempts+1)));\n  }\n }\n return out;\n}\nfunction\
          \ validateTask(input){\n if(!input||typeof input!=='object'||Array.isArray(input))fail(400,'Invalid task\
          \ payload.');\n const title=text(input.title,161),description=text(input.description,3001),categoryId=input.categoryId,\
          \ date=input.date;\n if(!title||title.length>160||description.length>3000)fail(400,'Title or description\
          \ length is invalid.');\n if(!validId(categoryId)||!validDate(date))fail(400,'Select a valid category\
          \ and date.');\n const repeat=['none','daily','weekly','monthly','yearly'].includes(input.repeat)?input.repeat:'none';\n\
          \ const endDate=input.endDate||'';\n if(endDate&&(!validDate(endDate)||endDate<date))fail(400,'Invalid\
          \ recurrence end date.');\n const weekdays=Array.isArray(input.weekdays)?[...new Set(input.weekdays)].filter(n=>Number.isInteger(n)&&n>=0&&n<=6):[];\n\
          \ const priority=['low','medium','high'].includes(input.priority)?input.priority:'medium';\n const kind=['task','birthday'].includes(input.kind)?input.kind:'task';\n\
          \ return {title,description,categoryId,date,repeat,endDate,weekdays,priority,kind};\n}\nasync function\
          \ ensureCategory(uid,id){if(!await get(userPK(uid),`CATEGORY#${id}`))fail(400,'Choose one of your own\
          \ categories.');}\nasync function profile(uid){const p=await get(userPK(uid),'PROFILE');if(!p)fail(403,'Set\
          \ up your profile first.');return p;}\nasync function bootstrap(uid,claims){\n const email=text(claims.email||'',250).toLowerCase();const\
          \ name=text(claims.name||email.split('@')[0],60)||'Member';\n if(!email||claims.email_verified!==true&&claims.email_verified!=='true')fail(403,'Please\
          \ verify your email first.');\n const prev=await get(userPK(uid),'PROFILE');if(prev)return {ok:true};\n\
          \ const actions=[{Put:{TableName,Item:{...key(userPK(uid),'PROFILE'),userId:uid,email,name},ConditionExpression:'attribute_not_exists(pk)'}},{Put:{TableName,Item:{...key(`EMAIL#${email}`,'LOOKUP'),userId:uid},ConditionExpression:'attribute_not_exists(pk)'}}];\n\
          \ for(const cat of defaultCategories)actions.push({Put:{TableName,Item:{...key(userPK(uid),`CATEGORY#${cat.id}`),...cat}}});\n\
          \ try{await db.send(new TransactWriteCommand({TransactItems:actions}));}catch(e){if(await get(userPK(uid),'PROFILE'))return\
          \ {ok:true};throw e;}\n return {ok:true};\n}\nasync function sync(uid){await profile(uid);const items=await\
          \ query(userPK(uid)),categories=[],friends=[],requests=[],ids=[];\n for(const x of items){if(x.sk.startsWith('CATEGORY#'))categories.push({id:x.id,name:x.name,color:x.color,icon:x.icon});else\
          \ if(x.sk.startsWith('FRIEND#'))friends.push({userId:x.userId,name:x.name,email:x.email});else if(x.sk.startsWith('REQ#'))requests.push({userId:x.userId,name:x.name,email:x.email});else\
          \ if(x.sk.startsWith('TASK#'))ids.push(x.taskId);}\n const tasks=(await batchGetTasks(ids)).filter(t=>Array.isArray(t.participantIds)&&t.participantIds.includes(uid));\n\
          \ return {tasks:tasks.map(({pk,sk,...rest})=>rest).sort((a,b)=>b.createdAt.localeCompare(a.createdAt)),categories,friends,requests};\n\
          }\nasync function saveCategory(uid,body){\n const id=body?.id,name=text(body?.name,33),icon=text(body?.icon,40),color=text(body?.color,7);\n\
          \ if(!validId(id)||!name||name.length>32||!/^#[0-9a-f]{6}$/i.test(color)||!/^[A-Za-z0-9]{1,40}$/.test(icon))fail(400,'Invalid\
          \ category.');\n const catItems=await query(userPK(uid),'CATEGORY#');if(catItems.length>=25&&!catItems.some(c=>c.id===id))fail(400,'Maximum\
          \ of 25 categories in this starter.');\n await put({...key(userPK(uid),`CATEGORY#${id}`),id,name,icon,color});return\
          \ {ok:true};\n}\nasync function deleteCategory(uid,id){\n if(!validId(id))fail(400,'Invalid category.');\n\
          \ const items=await query(userPK(uid),'TASK#'),tasks=await batchGetTasks(items.map(i=>i.taskId));if(tasks.some(t=>t.categoryId===id))fail(400,'Move\
          \ or remove tasks in this category first.');\n await del(userPK(uid),`CATEGORY#${id}`);return {ok:true};\n\
          }\nasync function friendsOnly(uid,ids){\n if(ids.length>7)fail(400,'A shared task supports up to eight\
          \ people including you.');\n for(const other of ids)if(!validId(other)||!await get(userPK(uid),`FRIEND#${other}`))fail(403,'You\
          \ can only add confirmed friends.');\n}\nasync function createTask(uid,body){\n const props=validateTask(body);await\
          \ ensureCategory(uid,props.categoryId);\n const extra=Array.isArray(body?.participantIds)?[...new Set(body.participantIds.filter(x=>x!==uid))]:[];\n\
          \ await friendsOnly(uid,extra);\n const id=randomUUID(),now=new Date().toISOString(),participants=[uid,...extra];\n\
          \ const task={...key(`TASK#${id}`,'META'),id,...props,ownerId:uid,participantIds:participants,completedDates:{},createdAt:now,updatedAt:now,version:1};\n\
          \ const operations=[{Put:{TableName,Item:task,ConditionExpression:'attribute_not_exists(pk)'}},...participants.map(userId=>({Put:{TableName,Item:{...key(userPK(userId),`TASK#${id}`),taskId:id}}}))];\n\
          \ await db.send(new TransactWriteCommand({TransactItems:operations}));return {task:{...props,id,ownerId:uid,participantIds:participants,completedDates:{},createdAt:now,updatedAt:now,version:1}};\n\
          }\nasync function authorizedTask(uid,id){if(!validId(id))fail(400,'Invalid task identifier.');const t=await\
          \ get(`TASK#${id}`,'META');if(!t)fail(404,'Task not found.');if(!t.participantIds?.includes(uid))fail(403,'You\
          \ cannot access this task.');return t;}\nasync function writeVersioned(task,changed){\n await db.send(new\
          \ PutCommand({TableName,Item:{...task,...changed,version:task.version+1,updatedAt:new Date().toISOString()},ConditionExpression:'#v\
          \ = :v',ExpressionAttributeNames:{'#v':'version'},ExpressionAttributeValues:{':v':task.version}}));\n\
          }\nasync function editTask(uid,id,body){const t=await authorizedTask(uid,id);if(t.ownerId!==uid)fail(403,'Only\
          \ the task creator can edit task details.');\n const props=validateTask(body);await ensureCategory(uid,props.categoryId);await\
          \ writeVersioned(t,props);return {ok:true};}\nasync function deleteTask(uid,id){const t=await authorizedTask(uid,id);if(t.ownerId!==uid)fail(403,'Only\
          \ the task creator can delete this shared task.');\n const operations=[{Delete:{TableName,Key:key(`TASK#${id}`,'META'),ConditionExpression:'#v\
          \ = :v',ExpressionAttributeNames:{'#v':'version'},ExpressionAttributeValues:{':v':t.version}}},...t.participantIds.map(p=>({Delete:{TableName,Key:key(userPK(p),`TASK#${id}`)}}))];\n\
          \ await db.send(new TransactWriteCommand({TransactItems:operations}));return {ok:true};}\nasync function\
          \ toggle(uid,id,body){\n const day=body?.date;if(!validDate(day))fail(400,'Invalid completion date.');\n\
          \ for(let attempts=0;attempts<4;attempts++){\n  const t=await authorizedTask(uid,id);if(!isOccurrence(t,day))fail(400,'This\
          \ task is not scheduled for that day.');\n  const completed={...(t.completedDates||{})};const people=new\
          \ Set(completed[day]||[]);if(people.has(uid))people.delete(uid);else people.add(uid);\n  if(people.size)completed[day]=[...people];else\
          \ delete completed[day];\n  // Prevent unlimited growth of a task record in this educational starter.\n\
          \  if(Object.keys(completed).length>450)fail(400,'This recurring task has reached its history limit. Start\
          \ a new task.');\n  try{await writeVersioned(t,{completedDates:completed});return {ok:true};}catch(e){if(e.name!=='ConditionalCheckFailedException')throw\
          \ e;}\n }\n fail(409,'This shared task was updated simultaneously. Please try again.');\n}\nasync function\
          \ invite(uid,body){const email=text(body?.email,250).toLowerCase(),sender=await profile(uid);\n if(!/^[^\\\
          s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email))fail(400,'Enter a valid email address.');\n const lookup=await\
          \ get(`EMAIL#${email}`,'LOOKUP');if(!lookup)fail(404,'This person has not created an Orbit account yet.');\n\
          \ const target=lookup.userId;if(target===uid)fail(400,'You cannot invite yourself.');\n if(await get(userPK(uid),`FRIEND#${target}`))fail(409,'You\
          \ are already friends.');\n if(await get(userPK(uid),`REQ#${target}`))fail(409,'This person has already\
          \ sent you a request; accept it instead.');\n await db.send(new PutCommand({TableName,Item:{...key(userPK(target),`REQ#${uid}`),userId:uid,email:sender.email,name:sender.name,createdAt:new\
          \ Date().toISOString()},ConditionExpression:'attribute_not_exists(pk)'}));\n return {ok:true};}\nasync\
          \ function accept(uid,body){const senderId=body?.userId;if(!validId(senderId))fail(400,'Invalid request.');\n\
          \ const request=await get(userPK(uid),`REQ#${senderId}`);if(!request)fail(404,'Friend request not found.');\n\
          \ const self=await profile(uid),other=await profile(senderId);\n await db.send(new TransactWriteCommand({TransactItems:[\n\
          \  {Put:{TableName,Item:{...key(userPK(uid),`FRIEND#${senderId}`),userId:senderId,name:other.name,email:other.email}}},\n\
          \  {Put:{TableName,Item:{...key(userPK(senderId),`FRIEND#${uid}`),userId:uid,name:self.name,email:self.email}}},\n\
          \  {Delete:{TableName,Key:key(userPK(uid),`REQ#${senderId}`),ConditionExpression:'attribute_exists(pk)'}}\n\
          \ ]}));return {ok:true};}\nasync function decline(uid,body){if(!validId(body?.userId))fail(400,'Invalid\
          \ request.');await del(userPK(uid),`REQ#${body.userId}`);return {ok:true};}\nexports.handler = async function\
          \ handler(event){\n try{\n  const claims=event.requestContext?.authorizer?.jwt?.claims;\n  if(!claims?.sub)fail(401,'Authentication\
          \ required.');\n  const uid=claims.sub,method=event.requestContext?.http?.method||'GET',path=(event.rawPath||'/').replace(/\\\
          /$/,'')||'/';\n  if(!TableName)fail(500,'Missing database configuration.');\n  if((event.body||'').length>16000)fail(413,'Request\
          \ body is too large.');\n  let body={};try{body=event.body?JSON.parse(event.body):{};}catch{fail(400,'Invalid\
          \ JSON.');}\n  if(method==='POST'&&path==='/bootstrap')return good(await bootstrap(uid,claims));\n  await\
          \ profile(uid);\n  if(method==='GET'&&path==='/sync')return good(await sync(uid));\n  if(method==='PUT'&&path==='/categories')return\
          \ good(await saveCategory(uid,body));\n  if(method==='DELETE'&&path.startsWith('/categories/'))return\
          \ good(await deleteCategory(uid,decodeURIComponent(path.split('/')[2])));\n  if(method==='POST'&&path==='/tasks')return\
          \ good(await createTask(uid,body),201);\n  const togglePath=path.match(/^\\/tasks\\/([^/]+)\\/toggle$/);\n\
          \  if(method==='POST'&&togglePath)return good(await toggle(uid,decodeURIComponent(togglePath[1]),body));\n\
          \  const taskPath=path.match(/^\\/tasks\\/([^/]+)$/);\n  if(taskPath&&method==='PATCH')return good(await\
          \ editTask(uid,decodeURIComponent(taskPath[1]),body));\n  if(taskPath&&method==='DELETE')return good(await\
          \ deleteTask(uid,decodeURIComponent(taskPath[1])));\n  if(method==='POST'&&path==='/friends/requests')return\
          \ good(await invite(uid,body),201);\n  if(method==='POST'&&path==='/friends/accept')return good(await\
          \ accept(uid,body));\n  if(method==='POST'&&path==='/friends/decline')return good(await decline(uid,body));\n\
          \  return good({error:'Unknown endpoint.'},404);\n }catch(e){const info=errInfo(e);if(info.statusCode>=500)console.error('Orbit\
          \ API server error',e);return good({error:info.message},info.statusCode);}\n}\n"
  OrbitLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${OrbitFunction}
      RetentionInDays: 7
  OrbitHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-http-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
        - Ref: AllowedFrontendOrigin
        AllowHeaders:
        - Authorization
        - Content-Type
        AllowMethods:
        - GET
        - POST
        - PATCH
        - PUT
        - DELETE
        - OPTIONS
        MaxAge: 600
  OrbitIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId:
        Ref: OrbitHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri:
        Fn::GetAtt:
        - OrbitFunction
        - Arn
      PayloadFormatVersion: '2.0'
  OrbitAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId:
        Ref: OrbitHttpApi
      AuthorizerType: JWT
      Name: OrbitCognitoJWT
      IdentitySource:
      - $request.header.Authorization
      JwtConfiguration:
        Issuer:
          Fn::Sub: https://cognito-idp.${AWS::Region}.amazonaws.com/${ExistingUserPoolId}
        Audience:
        - Ref: ExistingAppClientId
  OrbitRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId:
        Ref: OrbitHttpApi
      RouteKey: ANY /{proxy+}
      Target:
        Fn::Join:
        - ''
        - - integrations/
          - Ref: OrbitIntegration
      AuthorizationType: JWT
      AuthorizerId:
        Ref: OrbitAuthorizer
  OrbitStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId:
        Ref: OrbitHttpApi
      StageName: $default
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 8
        ThrottlingRateLimit: 2
  OrbitLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName:
        Ref: OrbitFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn:
        Fn::Sub: arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${OrbitHttpApi}/*
Outputs:
  ApiUrl:
    Description: VITE_API_URL
    Value:
      Fn::Sub: https://${OrbitHttpApi}.execute-api.${AWS::Region}.amazonaws.com
  Region:
    Description: VITE_AWS_REGION
    Value:
      Ref: AWS::Region
  CognitoUserPoolId:
    Description: VITE_COGNITO_USER_POOL_ID
    Value:
      Ref: ExistingUserPoolId
  CognitoUserPoolClientId:
    Description: VITE_COGNITO_CLIENT_ID
    Value:
      Ref: ExistingAppClientId
  DynamoDbTableName:
    Value:
      Ref: OrbitTable
